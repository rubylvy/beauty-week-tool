<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뷰티위크 배너 문구 기획 툴</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/variable/pretendardvariable.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "PretendardVariable", "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #111;
      background: #f8f8f8;
    }

    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Left Panel ── */
    .panel-left {
      width: 544px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #ebebeb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 20px 0;
      border-bottom: 1px solid #efefef;
      flex-shrink: 0;
    }

    .panel-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 12px; }

    /* ── Tabs ── */
    .tab-buttons {
      display: flex;
      gap: 0;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      background: #f5f5f5;
      border-bottom: 2px solid #ddd;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.12s;
    }

    .tab-btn:first-child { border-right: 1px solid #ddd; }

    .tab-btn:hover { background: #efefef; color: #555; }

    .tab-btn.active {
      background: #fff;
      color: #111;
      border-bottom-color: #707070;
    }

    .brand-form {
      flex: 1;
      overflow-y: auto;
      padding: 14px 20px 24px;
    }

    .brand-form::-webkit-scrollbar { width: 4px; }
    .brand-form::-webkit-scrollbar-track { background: transparent; }
    .brand-form::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .field-group {
      margin-bottom: 18px;
      padding: 12px 0;
      border-top: 1px solid #f0f0f0;
    }

    .field-group:first-child {
      border-top: none;
      padding-top: 0;
    }

    .field-group.highlight {
      background: #faf9ff;
      border: 1px solid #e8dff7;
      border-radius: 6px;
      padding: 14px 12px;
      margin-bottom: 20px;
    }

    .field-group-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #aaa;
      margin-bottom: 9px;
    }

    .field-group.highlight .field-group-title {
      color: #7c3aed;
      font-size: 11px;
    }

    .field-group.plan-group {
      border: 1.5px solid #d0d0d0;
      padding: 14px 12px;
      border-radius: 6px;
      margin-bottom: 18px;
      margin-top: 10px;
    }

    .field-group.plan-group .field-group-title {
      font-size: 12px;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
      text-transform: none;
      letter-spacing: 0;
    }

    .field-item { margin-bottom: 7px; }

    .field-label {
      font-size: 11.5px;
      font-weight: 500;
      color: #555;
      margin-bottom: 3px;
    }

    .benefit-item .field-label {
      color: #7c3aed;
      font-weight: 600;
      margin-top: 14px;
    }

    .field-input {
      width: 100%;
      padding: 6px 9px;
      border: 1.5px solid #e3e3e3;
      border-radius: 5px;
      font-family: inherit;
      font-size: 12.5px;
      color: #111;
      background: #fff;
      outline: none;
      transition: border-color 0.12s;
    }

    .field-input:focus { border-color: #707070; background: #fdfbff; }
    .field-input::placeholder { color: #ccc; }
    .field-input.sm { font-size: 12px; padding: 5px 8px; }

    /* 배너 소구 전체 박스 */
    .benefit-primary-box {
      background: #faf9ff;
      border: 1.5px solid #e8dff7;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 10px;
    }

    /* 배너 소구 옵션 버튼들 */
    .benefit-primary-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .benefit-primary-options .option-btn {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      background: #fafafa;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      color: #777;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .benefit-primary-options .option-btn:hover {
      border-color: #bbb;
      background: #f0f0f0;
      color: #555;
    }

    .benefit-primary-options .option-btn.active {
      border-color: #7c3aed;
      background: #ede9fe;
      color: #7c3aed;
      font-weight: 600;
    }

    /* 배너 소구 입력 박스 */
    .primary-row {
      display: none;
      align-items: center;
      gap: 6px;
    }

    .primary-row.active {
      display: flex;
    }

    .primary-row .field-input {
      flex: 1;
      background: #ffffff;
      border: 1.5px solid #d8b5ff;
      padding: 6px 9px;
    }

    .primary-row .field-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .primary-row .price-input {
      width: 70px;
      padding: 6px 9px;
      border: 1.5px solid #d8b5ff;
      border-radius: 5px;
      font-family: inherit;
      font-size: 12px;
      color: #111;
      background: #ffffff;
      outline: none;
      transition: all 0.12s;
    }

    .primary-row .price-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    /* 기타 베네핏 row */
    .benefit-extra-row {
      background: transparent;
      border: none;
      padding: 0;
      margin-bottom: 8px;
    }

    .benefit-extra-row .field-input {
      background: #fff;
      border: 1.5px solid #e3e3e3;
      padding: 6px 9px;
    }

    .char-counter {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .char-counter.cnt-ok   { background: #e5f7ed; color: #1b874a; }
    .char-counter.cnt-warn { background: #fff4e0; color: #c07000; }
    .char-counter.cnt-over { background: #ffebeb; color: #c0392b; }

    .input-hint {
      display: block;
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    /* Benefit block */
    .benefit-block { display: flex; flex-direction: column; }

    .benefit-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #bbb;
      margin: 8px 0 5px;
    }

    .benefit-section-label.primary-label { color: #888888; }

    /* Gift block */
    .gift-block {
      border: 1px solid #f0f0f0;
      border-radius: 5px;
      background: #faf9ff;
      padding: 7px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 5px;
    }

    .gift-block-label {
      font-size: 10.5px;
      font-weight: 700;
      color: #999999;
      margin-bottom: 2px;
    }

    .gift-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .gift-fixed {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .gift-amount-input {
      width: 48px;
      flex-shrink: 0;
      padding: 4px 6px;
      border: 1.5px solid #e3e3e3;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      color: #111;
      outline: none;
      transition: border-color 0.12s;
    }

    .gift-amount-input:focus { border-color: #888888; }
    .gift-amount-input::placeholder { color: #ccc; }

    .gift-flex-input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      border: 1.5px solid #e3e3e3;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      color: #111;
      outline: none;
      transition: border-color 0.12s;
    }

    .gift-flex-input:focus { border-color: #888888; }
    .gift-flex-input::placeholder { color: #ccc; }

    /* Method toggle */
    .gift-method-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .method-btn {
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 500;
      color: #999;
      cursor: pointer;
      transition: all 0.1s;
    }

    .method-btn.active {
      border-color: #888888;
      background: #efefef;
      color: #555555;
      font-weight: 700;
    }

    .gift-count-input {
      width: 40px;
      padding: 2px 5px;
      border: 1.5px solid #e3e3e3;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11.5px;
      color: #111;
      outline: none;
      transition: border-color 0.12s;
    }

    .gift-count-input:focus { border-color: #888888; }
    .gift-count-input::placeholder { color: #ccc; }

    /* Image link row inside gift block */
    .gift-img-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }

    .gift-img-label {
      font-size: 10px;
      color: #bbb;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .gift-img-input {
      flex: 1;
      min-width: 0;
      padding: 3px 6px;
      border: 1.5px solid #ececec;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      color: #888;
      background: #f3f3f3;
      outline: none;
      transition: border-color 0.12s;
    }

    .gift-img-input:focus { border-color: #888888; background: #fff; color: #333; }
    .gift-img-input::placeholder { color: #ddd; }

    /* ── Right Panel ── */
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .table-topbar {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ebebeb;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .topbar-title { font-size: 14px; font-weight: 700; color: #111; flex: 1; }

    .btn-action {
      padding: 6px 13px;
      border-radius: 5px;
      border: 1.5px solid #ddd;
      background: #fafafa;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: all 0.12s;
    }

    .btn-action:hover { border-color: #707070; color: #444444; background: #efefef; }
    .btn-action.done  { border-color: #1b874a; color: #1b874a; background: #e5f7ed; }

    .table-wrap {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: #c8c8c8; border-radius: 3px; }

    /* ── Summary Table ── */
    .summary-table {
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      width: 100%;
    }

    .summary-table .tbl-title {
      padding: 10px 16px;
      background: #f5f5f5;
      font-size: 12px;
      font-weight: 700;
      color: #444;
      border-bottom: 2px solid #d8d8d8;
      border-radius: 7px 7px 0 0;
    }

    .summary-table .section-row td {
      padding: 7px 16px 5px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9898b0;
      background: #f9f9f9;
      border-bottom: 1px solid #f0f0f0;
    }

    .summary-table .data-row td {
      padding: 5px 16px;
      border-bottom: 1px solid #f4f2fb;
      font-size: 12px;
      vertical-align: top;
    }

    .summary-table tr:last-child td { border-bottom: none; }

    .summary-table .row-label {
      width: 140px;
      color: #888;
      font-weight: 500;
      white-space: nowrap;
    }

    .summary-table .row-value       { color: #1a1a2e; }
    .summary-table .row-value.empty { color: #ccc; }
    .summary-table .row-value.link  { color: #707070; font-size: 11px; word-break: break-all; }

    /* ── Banner Copy Table ── */
    .copy-table {
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      width: 100%;
    }

    .copy-table thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 16px;
      background: #f5f5f5;
      font-size: 12px;
      font-weight: 700;
      color: #444;
      text-align: left;
      border-bottom: 2px solid #d8d8d8;
    }

    .copy-table thead th.col-type {
      position: sticky;
      left: 0;
      z-index: 20;
      background: #e8e8e8;
      min-width: 148px;
      max-width: 148px;
      border-right: 1px solid #d0d0d0;
    }

    .copy-table thead th.col-copy { min-width: 320px; }

    .copy-table tbody td {
      padding: 12px 16px;
      vertical-align: top;
      border-bottom: 1px solid #f0f0f0;
    }

    .copy-table tbody tr:last-child td { border-bottom: none; }

    .copy-table tbody td.col-type {
      position: sticky;
      left: 0;
      z-index: 5;
      background: #faf9ff;
      min-width: 148px;
      max-width: 148px;
      border-right: 1px solid #eae5f8;
    }

    .copy-table tbody tr:hover td         { background: #fafafa; }
    .copy-table tbody tr:hover td.col-type { background: #f2f2f2; }

    /* 원데이 row accent */
    .copy-table tbody tr.row-oneday td.col-type {
      border-left: 3px solid #8b5cf6;
    }
    .copy-table tbody tr.row-oneday .banner-name { color: #555555; }

    /* 기획전 row accent */
    .copy-table tbody tr.row-promo td.col-type {
      border-left: 3px solid #0ea5e9;
    }
    .copy-table tbody tr.row-promo .banner-name { color: #0369a1; }

    .banner-name { font-size: 12px; font-weight: 700; color: #2a2a3a; margin-bottom: 2px; }
    .banner-sub  { font-size: 10.5px; color: #9898b0; }

    .cell-lines { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .cell-line  { display: flex; align-items: baseline; gap: 5px; }

    .cell-text {
      font-size: 12.5px;
      color: #1a1a2e;
      line-height: 1.5;
      flex: 1;
      word-break: keep-all;
    }

    .badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      padding: 1.5px 5px;
      border-radius: 9px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .badge-ok   { background: #e5f7ed; color: #1b874a; }
    .badge-warn { background: #fff4e0; color: #c07000; }
    .badge-over { background: #ffebeb; color: #c0392b; }

    .no-text-label { font-size: 12px; color: #ccc; font-style: italic; }
    .cell-footer   { display: flex; justify-content: flex-end; }

    .btn-copy {
      padding: 2.5px 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fafafa;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      color: #777;
      cursor: pointer;
      transition: all 0.12s;
    }

    .btn-copy:hover  { border-color: #707070; color: #444444; background: #efefef; }
    .btn-copy.copied { border-color: #1b874a; color: #1b874a; background: #e5f7ed; }

    /* ── 시트 전송 버튼 ── */
    .btn-send {
      padding: 6px 14px;
      border-radius: 5px;
      border: 1.5px solid #16a34a;
      background: #16a34a;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-send:hover    { background: #15803d; border-color: #15803d; }
    .btn-send:disabled { background: #86efac; border-color: #86efac; color: #fff; cursor: not-allowed; }
    .btn-send.sending  { background: #6ee7b7; border-color: #6ee7b7; color: #065f46; }
    .btn-send.success  { background: #dcfce7; border-color: #16a34a; color: #15803d; }
    .btn-send.error    { background: #fef2f2; border-color: #ef4444; color: #dc2626; }

    /* ── 설정 버튼 ── */
    .btn-settings {
      padding: 6px 11px;
      border-radius: 5px;
      border: 1.5px solid #e0e0e0;
      background: #fafafa;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-settings:hover { border-color: #aaa; color: #555; background: #f4f4f4; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 24px 24px 20px;
      width: 420px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 18px;
    }

    .modal-field { margin-bottom: 14px; }

    .modal-label {
      font-size: 11.5px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }

    .modal-desc {
      font-size: 10.5px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .modal-input {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #ddd;
      border-radius: 5px;
      font-family: inherit;
      font-size: 12.5px;
      color: #111;
      outline: none;
      transition: border-color 0.12s;
    }
    .modal-input:focus { border-color: #707070; }
    .modal-input::placeholder { color: #ccc; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .modal-btn-cancel {
      padding: 7px 14px;
      border-radius: 5px;
      border: 1.5px solid #ddd;
      background: #fafafa;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #777;
      cursor: pointer;
    }
    .modal-btn-cancel:hover { border-color: #aaa; color: #444; }

    .modal-btn-save {
      padding: 7px 16px;
      border-radius: 5px;
      border: 1.5px solid #707070;
      background: #707070;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    .modal-btn-save:hover { background: #6534f5; border-color: #6534f5; }

    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-dot.ok  { background: #16a34a; }
    .status-dot.no  { background: #e5e5e5; }
    .modal-status {
      font-size: 10.5px;
      color: #888;
      margin-top: 6px;
    }

    /* Test Button */
    .btn-test {
      width: 100%;
      padding: 5px 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #d0d0d0;
      background: #efefef;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #707070;
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-test:hover { border-color: #707070; background: #e8d9ff; color: #6534f5; }
  </style>
</head>
<body>
<div class="app">

  <!-- Left Panel -->
  <aside class="panel-left">
    <div class="panel-header">
      <div class="panel-title">뷰티위크 배너 문구 기획</div>
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="oneday">원데이</button>
        <button class="tab-btn" data-tab="live">라이브</button>
      </div>
    </div>
    <div style="padding: 0 20px; margin-top: 10px;">
      <button class="btn-test" id="btnTestData">테스트 데이터 입력</button>
    </div>

function v(x)   { return (x && x.trim()) ? x.trim() : '?'; }
function vb(b)  { return b && b.primary && b.primary.trim() ? b.primary.trim() : '?'; }
function str(x) { return (x && x.trim()) ? x.trim() : '—'; }
function pct(x) { return (x && x.trim()) ? `${x.trim()}%` : '—'; }

function formatGift(gift, i) {
  const methods = gift.methods || [];
  const isBasic = methods.length === 0;

  if (i === 2) {
    if (!gift.content?.trim() && !gift.item?.trim()) return null;
    if (isBasic) {
      return `${v(gift.content)} 구매 시, ${v(gift.item)} 증정`;
    }
    const distStrs = [];
    if (methods.includes('random')) distStrs.push('랜덤');
    if (methods.includes('first')) {
      distStrs.push(`선착순 ${gift.count && gift.count.trim() ? gift.count.trim() + '명' : '?명'}`);
    }
    return `${v(gift.content)} 구매 시, ${v(gift.item)} ${distStrs.join(' / ')} 증정`;
  }

  if (!gift.amount?.trim() && !gift.item?.trim()) return null;
  if (isBasic) {
    return `${v(gift.amount)}만 원 이상 구매 시, ${v(gift.item)} 증정`;
  }

  const distStrs = [];
  if (methods.includes('random')) distStrs.push('랜덤');
  if (methods.includes('first')) {
    distStrs.push(`선착순 ${gift.count && gift.count.trim() ? gift.count.trim() + '명' : '?명'}`);
  }
  return `${v(gift.amount)}만 원 이상 구매 시, ${v(gift.item)} ${distStrs.join(' / ')} 증정`;
}

function badgeClass(len, limit) {
  if (limit === null) return null;
  if (len >= limit)                  return 'badge-over';
  if (len >= Math.ceil(limit * 0.8)) return 'badge-warn';
  return 'badge-ok';
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function flashBtn(btn, label) {
  btn.textContent = label;
  btn.classList.add('done');

  const formId = `brandForm-${currentTab}`;

  el.innerHTML = '';
  FORM_SCHEMA.forEach(({ group, items, highlight }) => {
    const groupEl = document.createElement('div');
    const isPlanGroup = group.includes('기획전');
    groupEl.className = 'field-group' + (highlight ? ' highlight' : '') + (isPlanGroup ? ' plan-group' : '');
    const gt = document.createElement('div');
    gt.className = 'field-group-title';
    gt.textContent = group;
    groupEl.appendChild(gt);
    items.forEach(item => {
      if (item.type === 'input') {
        groupEl.appendChild(makeInput(item));
      } else if (item.type === 'issue') {
        groupEl.appendChild(makeIssue(item));
      } else {
        groupEl.appendChild(makeBenefit(item));
      }
    });
    el.appendChild(groupEl);
  });
}

  const wrap = document.createElement('div');
  wrap.className = 'field-item';

  lbl.className = 'field-label';
  lbl.textContent = label;
  const inp = document.createElement('input');
  inp.type = inputType || 'text'; inp.className = 'field-input sm';
  inp.placeholder = ph || ''; inp.value = data[currentTab][key] || '';
  inp.addEventListener('input', () => { data[currentTab][key] = inp.value; refresh(); });
  wrap.appendChild(lbl); wrap.appendChild(inp);
  return wrap;
}

/* ── Summary Data ───────────────────────────────────────────────────────── */
function getSummaryData() {
  const current = data[currentTab];
  const rows = [];
  const section = t  => rows.push({ type: 'section', text: t });
  const row     = (label, value, empty, isLink) =>
    rows.push({ type: 'row', label, value, empty: !!empty, isLink: !!isLink });

  function addBenefit(b, prefix) {
    row(`${prefix} 배너 소구`, str(b.primary), !b.primary.trim());
    b.gifts.forEach((g, i) => {
      const text = formatGift(g, i);
      row(`사은품 ${i + 1}`, text || '—', !text);
      const hasUrl = g.imageUrl && g.imageUrl.trim();
      row(`사은품 ${i + 1} 이미지`, str(g.imageUrl), !hasUrl, !!hasUrl);
    });
    row(`${prefix} 기타 베네핏`, str(b.extra), !b.extra.trim());
    if (prefix === '원데이') {
      row(`${prefix} 유의사항`, str(b.precaution), !b.precaution.trim());
    }
  }

  section('기본 정보');
  row('진행 일자', str(current.campaignDate), !current.campaignDate.trim());
  row('담당 MD',   str(current.mdName),       !current.mdName.trim());
  row('브랜드',    str(current.brand),       !current.brand.trim());
  row('메인이슈',  current.mainIssueProduct ? `${current.mainIssueProduct} ${current.mainIssue}` : str(current.mainIssue),   !current.mainIssue.trim());
  row('룩북 링크', str(current.lookbookUrl), !current.lookbookUrl.trim(), !!current.lookbookUrl.trim());
  row('로고 링크', str(current.logoUrl),     !current.logoUrl.trim(),     !!current.logoUrl.trim());

  section('원데이 기획전');
  row('최대 할인율', pct(current.odMax),    !current.odMax.trim());
  row('쿠폰 할인율', pct(current.odCoupon), !current.odCoupon.trim());
  addBenefit(current.odBenefit, '원데이');

  section('일반 기획전');
  row('최대 할인율', pct(current.pgMax),    !current.pgMax.trim());
  row('쿠폰율',      pct(current.pgCoupon), !current.pgCoupon.trim());
  addBenefit(current.pgBenefit, '기획전');

  return rows;
}

/* ── Banner Copy Table ──────────────────────────────────────────────────── */
function buildCopyTable() {
  const tbody = document.getElementById('copyBody');
  BANNERS.forEach((banner, bi) => {
    const row = document.createElement('tr');
    row.id = `row-${bi}`;
    if (banner.type) row.className = `row-${banner.type}`;

    const td0 = document.createElement('td');
    td0.className = 'col-type';
    td0.innerHTML = `<div class="banner-name">${banner.name}</div><div class="banner-sub">${banner.sub}</div>`;
    row.appendChild(td0);
    row.appendChild(buildCell(bi));
    tbody.appendChild(row);
  });
}

function buildCell(bi) {
  const banner = BANNERS[bi];
  const td = document.createElement('td');
  td.className = 'col-copy'; td.id = `cell-${bi}`;

  if (!banner.lines) {
    const lbl = document.createElement('span');
    lbl.className = 'no-text-label'; lbl.textContent = '이미지 전용';
    td.appendChild(lbl); return td;
  }

  const lineData = banner.lines();
  const linesDiv = document.createElement('div');
  linesDiv.className = 'cell-lines';

  lineData.forEach(line => {
    const lineEl = document.createElement('div'); lineEl.className = 'cell-line';
    const textEl = document.createElement('span'); textEl.className = 'cell-text'; textEl.textContent = line.text;
    lineEl.appendChild(textEl);
    if (line.limit !== null) {
      const len = line.text.length;
      const badge = document.createElement('span');
      badge.className = `badge ${badgeClass(len, line.limit)}`;
      badge.textContent = `${len}/${line.limit}`;
      lineEl.appendChild(badge);
    }
    linesDiv.appendChild(lineEl);
  });

  td.appendChild(linesDiv);

  const footer = document.createElement('div'); footer.className = 'cell-footer';
  const btn = document.createElement('button'); btn.className = 'btn-copy'; btn.textContent = '복사';
  btn.onclick = () => {
    const text = banner.lines().map(l => l.text).join('\n');
    copyToClipboard(text).then(() => {
      btn.textContent = '복사됨'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
    });
  };
  footer.appendChild(btn); td.appendChild(footer);
  return td;
}

/* ── Refresh ────────────────────────────────────────────────────────────── */
function refresh() {
  renderSummary();
  BANNERS.forEach((_, bi) => {
    const row = document.getElementById(`row-${bi}`);
    if (row) row.replaceChild(buildCell(bi), row.cells[1]);
  });
  saveData();
}

/* ── CSV: 내용만, 섹션 구분 포함 ───────────────────────────────────────── */
function generateCSV() {
  const current = data[currentTab];
  const lines = [];

  // 기본 정보
  lines.push('기본 정보');
  if (current.brand.trim())       lines.push(current.brand.trim());
  if (current.mainIssue.trim())   lines.push(current.mainIssue.trim());
  if (current.lookbookUrl.trim()) lines.push(current.lookbookUrl.trim());
  if (current.logoUrl.trim())     lines.push(current.logoUrl.trim());
  lines.push('');

  function addBenefitCSV(b) {
    if (b.primary.trim()) lines.push(b.primary.trim());
    b.gifts.forEach((g, i) => {
      const text = formatGift(g, i);
      if (text) {
        lines.push(text);
        lines.push(g.imageUrl.trim());
      }
    });
    if (b.extra.trim()) lines.push(b.extra.trim());
  }

  // 원데이 기획전
  lines.push('원데이 기획전');
  if (current.odMax.trim())    lines.push(`${current.odMax.trim()}%`);
  if (current.odCoupon.trim()) lines.push(`${current.odCoupon.trim()}%`);
  addBenefitCSV(current.odBenefit);
  lines.push('');

  // 일반 기획전
  lines.push('일반 기획전');
  if (current.pgMax.trim())    lines.push(`${current.pgMax.trim()}%`);
  if (current.pgCoupon.trim()) lines.push(`${current.pgCoupon.trim()}%`);
  addBenefitCSV(current.pgBenefit);
  lines.push('');

  // 배너 문구
  lines.push('배너 문구');
  BANNERS.forEach(banner => {
    if (!banner.lines) return;
    banner.lines().forEach(line => lines.push(line.text));
  });

  return lines.join('\n');
}

/* ── JSON ───────────────────────────────────────────────────────────────── */
function generateJSON() {
  const current = data[currentTab];
  const banners = {};
  BANNERS.forEach(b => { banners[b.name] = b.lines ? b.lines().map(l => l.text) : null; });

  const fmtGifts = (b) => b.gifts.map((g, i) => ({
    text: formatGift(g, i) || '', imageUrl: g.imageUrl || '',
  }));

  return JSON.stringify({
    exportedAt: new Date().toISOString().slice(0, 10),
    brand: current.brand, mainIssue: current.mainIssue,
    lookbookUrl: current.lookbookUrl, logoUrl: current.logoUrl,
    odMax: current.odMax, odCoupon: current.odCoupon,
    odBenefit: { primary: current.odBenefit.primary, gifts: fmtGifts(current.odBenefit), extra: current.odBenefit.extra },
    pgMax: current.pgMax, pgCoupon: current.pgCoupon,
    pgBenefit: { primary: current.pgBenefit.primary, gifts: fmtGifts(current.pgBenefit), extra: current.pgBenefit.extra },
    banners,
  }, null, 2);
}

/* ── localStorage keys ──────────────────────────────────────────────────── */
const LS_SCRIPT = 'beautyWeek_scriptUrl';
const LS_SHEET  = 'beautyWeek_sheetUrl';
const LS_DATA   = 'beautyWeek_data';

/* ── Data Persistence ───────────────────────────────────────────────────── */
function saveData() {
  localStorage.setItem(LS_DATA, JSON.stringify(data));
}

function loadData() {
  const saved = localStorage.getItem(LS_DATA);
  if (saved) {
    try {
      const loaded = JSON.parse(saved);
      if (loaded.oneday) Object.assign(data.oneday, loaded.oneday);
      if (loaded.live)   Object.assign(data.live, loaded.live);
    } catch (e) {
      console.error('Failed to load data:', e);
    }
  }
}

/* ── Settings Modal ─────────────────────────────────────────────────────── */
function updateSettingsStatus() {
  const scriptUrl = localStorage.getItem(LS_SCRIPT) || '';
  const sheetUrl  = localStorage.getItem(LS_SHEET)  || '';

  const dotScript = document.getElementById('dotScriptUrl');
  const dotSheet  = document.getElementById('dotSheetUrl');
  const stScript  = document.getElementById('statusScriptUrl');
  const stSheet   = document.getElementById('statusSheetUrl');

  if (scriptUrl) {
    dotScript.className = 'status-dot ok';
    stScript.innerHTML  = `<span class="status-dot ok"></span>설정됨 — <span style="font-size:10px;color:#555;word-break:break-all;">${scriptUrl.slice(0, 60)}…</span>`;
  } else {
    dotScript.className = 'status-dot no';
    stScript.innerHTML  = `<span class="status-dot no"></span>미설정`;
  }

  if (sheetUrl) {
    dotSheet.className = 'status-dot ok';
    stSheet.innerHTML  = `<span class="status-dot ok"></span>설정됨 — <span style="font-size:10px;color:#555;word-break:break-all;">${sheetUrl.slice(0, 60)}…</span>`;
  } else {
    dotSheet.className = 'status-dot no';
    stSheet.innerHTML  = `<span class="status-dot no"></span>미설정`;
  }
}

function openSettings() {
  document.getElementById('inputScriptUrl').value = localStorage.getItem(LS_SCRIPT) || '';
  document.getElementById('inputSheetUrl').value  = localStorage.getItem(LS_SHEET)  || '';
  updateSettingsStatus();
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

document.getElementById('btnSettings').onclick = openSettings;
document.getElementById('btnSettingsCancel').onclick = closeSettings;

document.getElementById('settingsOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

document.getElementById('btnSettingsSave').onclick = function() {
  const scriptUrl = document.getElementById('inputScriptUrl').value.trim();
  const sheetUrl  = document.getElementById('inputSheetUrl').value.trim();

  if (!scriptUrl || !sheetUrl) {
    alert('Apps Script URL과 구글 시트 URL을 모두 입력해 주세요.');
    return;
  }

  if (scriptUrl) localStorage.setItem(LS_SCRIPT, scriptUrl);
  else           localStorage.removeItem(LS_SCRIPT);
  if (sheetUrl)  localStorage.setItem(LS_SHEET, sheetUrl);
  else           localStorage.removeItem(LS_SHEET);
  updateSettingsStatus();
  closeSettings();
};

/* ── Sheet Submit ───────────────────────────────────────────────────────── */
const BANNER_COL_ORDER = [
  '원데이 1탭 배너', '기획전 1탭 배너', '기획전 퀵메뉴', '원데이 PDP 배너',
  '원데이 배너상품조합TC', '원데이 검색화면배너', '기획전 배너상품조합TC',
  'CLP 배너', '기획전 스토어홈배너',
];

function buildSheetPayload() {
  const current = data[currentTab];
  const pct = x => x && x.trim() ? x.trim() + '%' : '';
  const giftStr = (b, i) => formatGift(b.gifts[i], i) || '';

  // 시트 행 순서와 동일하게 배열로 구성
  const columnData = [
    // 기본 정보
    current.campaignDate.trim(),
    current.mdName.trim(),
    current.brand.trim(),
    current.mainIssue.trim(),
    current.lookbookUrl.trim(),
    current.logoUrl.trim(),
    // 원데이 기획전
    pct(current.odMax),
    pct(current.odCoupon),
    current.odBenefit.primary.trim(),
    giftStr(current.odBenefit, 0),
    current.odBenefit.gifts[0].imageUrl.trim(),
    giftStr(current.odBenefit, 1),
    current.odBenefit.gifts[1].imageUrl.trim(),
    giftStr(current.odBenefit, 2),
    current.odBenefit.gifts[2].imageUrl.trim(),
    current.odBenefit.extra.trim(),
    current.odBenefit.precaution.trim(),
    // 일반 기획전
    pct(current.pgMax),
    pct(current.pgCoupon),
    current.pgBenefit.primary.trim(),
    giftStr(current.pgBenefit, 0),
    current.pgBenefit.gifts[0].imageUrl.trim(),
    giftStr(current.pgBenefit, 1),
    current.pgBenefit.gifts[1].imageUrl.trim(),
    giftStr(current.pgBenefit, 2),
    current.pgBenefit.gifts[2].imageUrl.trim(),
    current.pgBenefit.extra.trim(),
  ];

  // 배너 라인들을 개별 행으로 추가
  BANNERS.forEach(banner => {
    if (!banner.lines) {
      columnData.push('');  // 이미지 전용 배너는 빈 값
    } else {
      const lines = banner.lines();
      lines.forEach(line => {
        columnData.push(line.text);
      });
    }
  });

  return {
    sheetUrl:   localStorage.getItem(LS_SHEET) || '',
    brand:      current.brand.trim(),
    tab:        currentTab,
    columnData: columnData,
  };
}

function submitToSheet() {
  const scriptUrl = localStorage.getItem(LS_SCRIPT) || '';
  const sheetUrl  = localStorage.getItem(LS_SHEET)  || '';
  const btn = document.getElementById('btnSend');

  if (!scriptUrl) {
    openSettings();
    return;
  }
  if (!sheetUrl) {
    openSettings();
    return;
  }
  if (!data[currentTab].brand.trim()) {
    alert('브랜드명을 먼저 입력해 주세요.');
    return;
  }

  // sending state
  btn.textContent = '전송 중...';
  btn.className   = 'btn-send sending';
  btn.disabled    = true;

  const payload = buildSheetPayload();

  fetch(scriptUrl, {
    method:  'POST',
    mode:    'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body:    JSON.stringify(payload),
  })
  .then(() => {
    btn.textContent = '전송 완료';
    btn.className   = 'btn-send success';
    setTimeout(() => {
      btn.textContent = btn.dataset.label;
      btn.className   = 'btn-send';
      btn.disabled    = false;
    }, 2500);
  })
  .catch(() => {
    btn.textContent = '전송 실패';
    btn.className   = 'btn-send error';
    btn.disabled    = false;
    setTimeout(() => {
      btn.textContent = btn.dataset.label;
      btn.className   = 'btn-send';
    }, 2500);
  });
}

document.getElementById('btnSend').setAttribute('data-label', '시트 전송');
document.getElementById('btnSend').onclick = submitToSheet;

/* ── Tab Switching ──────────────────────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === currentTab) return;

    currentTab = tab;

    // 탭 버튼 활성화 상태 업데이트
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // 폼 전환
    document.querySelectorAll('.brand-form').forEach(f => f.style.display = 'none');
    document.getElementById(`brandForm-${tab}`).style.display = '';

    // 우측 패널 갱신
    refresh();
    renderForm();
  });
});
